name: Stylelint

on: push

jobs:
  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm install

    - name: Run Stylelint
      run: npm run lint:css
