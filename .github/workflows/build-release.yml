name: Build release zip

on:
  workflow_dispatch

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build theme
      run: |
        composer install --no-dev
        npm install
        npm run build

    - name: Create ZIP archive
      run: |
        THEME_SLUG=amalfi
        mkdir -p "dist/${THEME_SLUG}"
        rsync -a --exclude-from=.distignore --exclude="/dist" ./ "dist/${THEME_SLUG}/"
        cd dist
        zip -r "../${THEME_SLUG}.zip" "${THEME_SLUG}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: amalfi
        path: amalfi.zip
